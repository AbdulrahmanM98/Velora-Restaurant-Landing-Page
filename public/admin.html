<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velora Admin — Reservations</title>
<style>
:root{--bg:#0b0b0a;--card:#151512;--text:#f5f0e8;--muted:#aaa59b;--gold:#c7a66a;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{width:min(1200px,calc(100% - 32px));margin:48px auto}h1{font-family:Georgia,serif;font-size:42px;margin:0 0 8px}p{color:var(--muted)}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.actions{display:flex;gap:10px}button{background:var(--gold);border:0;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.secondary{background:#24231f;color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}th{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.08em}td{font-size:14px}select{background:#22211d;color:#fff;border:1px solid #44403a;padding:8px 10px;border-radius:10px}.delete{background:#5b2020;color:#fff;padding:8px 10px}.empty{padding:30px;color:var(--muted)}.status{margin-top:16px;color:var(--muted);font-size:13px}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Velora Reservations</h1><p>Admin dashboard for the landing page reservation API.</p></div>
    <div class="actions"><a href="/" style="text-decoration:none"><button class="secondary">View website</button></a><button onclick="loadReservations()">Refresh</button></div>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>ID</th><th>Guest</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th><th>Occasion</th><th>Status</th><th>Created</th><th>Action</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No reservations yet.</div>
  </div>
  <div class="status" id="status"></div>
</div>
<script>
const rows=document.getElementById('rows'),empty=document.getElementById('empty'),statusBox=document.getElementById('status');
async function loadReservations(){
  statusBox.textContent='Loading...';
  try{
    const res=await fetch('/api/reservations');
    if(!res.ok)throw new Error('Could not load reservations.');
    const data=await res.json();rows.innerHTML='';empty.hidden=data.length>0;
    data.forEach(r=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td>#${r.id}</td>
        <td><strong>${escapeHtml(r.name)}</strong></td>
        <td>${escapeHtml(r.phone)}</td>
        <td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.time)}</td>
        <td>${escapeHtml(r.guests)}</td>
        <td>${escapeHtml(r.occasion||'-')}</td>
        <td><select onchange="updateStatus(${r.id},this.value)">
          ${['pending','confirmed','cancelled'].map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${s}</option>`).join('')}
        </select></td>
        <td>${formatDate(r.created_at)}</td>
        <td><button class="delete" onclick="deleteReservation(${r.id})">Delete</button></td>`;
      rows.appendChild(tr);
    });
    statusBox.textContent=data.length+' reservation(s) loaded.';
  }catch(e){statusBox.textContent=e.message}
}
async function updateStatus(id,status){
  const res=await fetch('/api/reservations/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
  const data=await res.json();statusBox.textContent=data.message||'Status updated.';
  if(!res.ok)loadReservations();
}
async function deleteReservation(id){
  if(!confirm('Delete reservation #'+id+'?'))return;
  const res=await fetch('/api/reservations/'+id,{method:'DELETE'});
  const data=await res.json();statusBox.textContent=data.message||'Reservation deleted.';
  if(res.ok)loadReservations();
}
function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDate(v){if(!v)return '-';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString()}
loadReservations();
</script>
</body>
</html>
